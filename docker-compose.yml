services:
  dst_master:
    platform: linux/amd64
    build: .
    image: ${DST_IMAGE:-gloryhuis/dst-dedicated-server:latest}
    container_name: dst_master
    restart: unless-stopped
    ports:
      - "10999:10999/udp"
    networks:
      - dst_cluster
    volumes:
      - ./DSTClusterConfig:/home/dst/.klei/DoNotStarveTogether/DSTWhalesCluster
      - ./volumes/mods:/home/dst/server_dst/mods
    environment:
      SHARD_NAME: Master
      CLUSTER_NAME: DSTWhalesCluster
    stdin_open: true
    tty: true

  dst_caves:
    platform: linux/amd64
    build: .
    image: ${DST_IMAGE:-gloryhuis/dst-dedicated-server:latest}
    container_name: dst_caves
    restart: unless-stopped
    depends_on:
      - dst_master
    ports:
      - "10998:10998/udp"
    networks:
      - dst_cluster
    volumes:
      - ./DSTClusterConfig:/home/dst/.klei/DoNotStarveTogether/DSTWhalesCluster
      - ./volumes/mods:/home/dst/server_dst/mods
    environment:
      SHARD_NAME: Caves
      CLUSTER_NAME: DSTWhalesCluster

networks:
  dst_cluster:
